@version: 4.7
@include "scl.conf"
source s_network_ise {
syslog(transport("udp") port(1025));
};
destination d_http_ise {
http(
url("https://collector.example/ise")
method("POST")
msg_data_in_header(no)
headers("X-AUTH_KEY: `NFG_AUTH_KEY`", "X-AGGREGATOR_NAME: agg-1")
body("<$PRI>$YEAR-$MONTH-${DAY}T$HOUR:$MIN:$SEC.$MSEC $HOST $PROGRAM: $MSG")
response-action(400 => success, 404 => success)
);
};
log {
source(s_network_ise);
destination(d_http_ise);
};
