@version: 4.7
@include "scl.conf"
source s_local {
internal();
};
source s_network_ise {
syslog(transport("udp") port(1025));
};
source s_network_suricata {
internal();
syslog(transport("udp") port(1027));
};
destination d_http_ise {
http(
url("https://collector.example/ise")
method("POST")
msg_data_in_header(no)
headers("X-AUTH_KEY: `NFG_AUTH_KEY`", "X-AGGREGATOR_NAME: agg-1")
body("<$PRI>$YEAR-$MONTH-${DAY}T$HOUR:$MIN:$SEC.$MSEC $HOST $PROGRAM: $MSG")
response-action(400 => drop, 404 => drop)
);
};
destination d_http_suricata {
http(
url("https://collector.example/suricata")
method("POST")
msg_data_in_header(no)
headers("X-AUTH_KEY: `NFG_AUTH_KEY`", "X-AGGREGATOR_NAME: agg-1")
body("<$PRI>$YEAR-$MONTH-${DAY}T$HOUR:$MIN:$SEC.$MSEC $HOST $PROGRAM $MSG")
response-action(400 => drop, 404 => drop)
);
};
log {
source(s_network_ise);
destination(d_http_ise);
};
log {
source(s_network_suricata);
destination(d_http_suricata);
};
