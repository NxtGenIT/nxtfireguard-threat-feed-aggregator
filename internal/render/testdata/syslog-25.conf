@version: 4.7
@include "scl.conf"
source s_network_firepower {
syslog(transport("udp") port(514));
};
source s_network_suricata {
syslog(transport("udp") port(1027));
};
source s_network_pfsense {
syslog(transport("udp") port(1028));
};
filter f_suricata_eve {
program("suricata") and message("^\\s*\\{");
};
destination d_http_firepower {
http(
url("https://collector.example/firepower")
method("POST")
msg_data_in_header(no)
headers("X-AUTH_KEY: `NFG_AUTH_KEY`", "X-AGGREGATOR_NAME: agg-1")
body("<$PRI>$YEAR-$MONTH-${DAY}T$HOUR:$MIN:$SEC.$MSEC $HOST $PROGRAM: $MSG")
response-action(400 => success, 404 => success)
);
};
destination d_http_suricata {
http(
url("https://collector.example/suricata")
method("POST")
msg_data_in_header(no)
headers("X-AUTH_KEY: `NFG_AUTH_KEY`", "X-AGGREGATOR_NAME: agg-1")
body("<$PRI>$YEAR-$MONTH-${DAY}T$HOUR:$MIN:$SEC.$MSEC $HOST $PROGRAM $MSG")
response-action(400 => success, 404 => success)
);
};
destination d_http_pfsense {
http(
url("https://collector.example/pfsense")
method("POST")
msg_data_in_header(no)
headers("X-AUTH_KEY: `NFG_AUTH_KEY`", "X-AGGREGATOR_NAME: agg-1")
body("<$PRI>$YEAR-$MONTH-${DAY}T$HOUR:$MIN:$SEC.$MSEC $HOST $PROGRAM: $MSG")
response-action(400 => success, 404 => success)
);
};
log {
source(s_network_firepower);
destination(d_http_firepower);
};
log {
source(s_network_suricata);
destination(d_http_suricata);
};
log {
source(s_network_pfsense);
filter(f_suricata_eve);
destination(d_http_pfsense);
};
