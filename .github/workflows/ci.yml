name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so a new upstream image or Docker release breaking the
    # relays shows up without a code change.
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - name: Cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/aggregator
          done

  docker:
    # Starts the real syslog-ng image and checks a message reaches a fake
    # collector with the auth key taken from the environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags docker -run Integration -v ./internal/reconcile/

  e2e:
    # The real binary against a fake NxtFireGuard backend, with real
    # containers (syslog-ng; Logstash + Elasticsearch for T-Pot) and real
    # syslog traffic. See "Testing" in the README.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: syslog
            run: "^Test[^T]"
          - name: tpot
            run: "^TestTPot$"
    name: e2e (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download v1.0.9 for the upgrade test
        if: matrix.name == 'syslog'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.9 -R "$GITHUB_REPOSITORY" -p nfgtfa-linux-amd64.tar.gz -p checksums.txt -D "$RUNNER_TEMP/v1"
          cd "$RUNNER_TEMP/v1"
          tar -xzf nfgtfa-linux-amd64.tar.gz
          grep ' nfgtfa-linux-amd64$' checksums.txt | sha256sum -c -
          echo "NFGTFA_V1_BINARY=$RUNNER_TEMP/v1/nfgtfa-linux-amd64" >> "$GITHUB_ENV"
      - name: End-to-end tests
        run: go test -tags e2e -count=1 -timeout 14m -v -run '${{ matrix.run }}' ./e2e/
